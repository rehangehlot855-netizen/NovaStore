<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA STORE - High Fashion & Luxury</title>
    <!-- Luxury Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Top Announcement Bar -->
    <div class="top-bar">
        COMPLIMENTARY EXPRESS SHIPPING ACROSS KSA | EXCLUSIVE ATELIER COLLECTION
    </div>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">NOVA <span>STORE</span></div>
        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#products">Collection</a>
            <a href="#admin">Add Product</a>
        </nav>
        <div class="header-icons">
            <div class="cart-icon" onclick="toggleCart()">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-count" id="cart-count">0</span>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <p>AUTUMN / WINTER 2026</p>
        <h1>HAUTE COUTURE</h1>
        <a href="#products" class="btn-hero">Explore The Selection</a>
    </section>

    <!-- Products Section -->
    <section id="products" class="products-section">
        <h2 class="section-title">Curated Collection</h2>
        <div class="product-grid" id="product-grid">
            <!-- Products will load dynamically via JS -->
        </div>
    </section>

    <!-- Admin Section -->
    <section id="admin" class="admin-section">
        <div class="admin-card">
            <h2>Add Exclusive Item</h2>
            <p class="admin-subtitle">Catalog Management</p>
            <form id="add-product-form" class="admin-form">
                <input type="text" id="p-title" placeholder="Product Title (e.g. Royal Silk Kaftan)" required>
                <input type="number" id="p-price" placeholder="Price in SAR" required>
                <input type="url" id="p-image" placeholder="Image URL (Unsplash / Web link)" required>
                <button type="submit" class="btn-publish">Publish To Store</button>
            </form>
        </div>
    </section>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/966500000000" class="whatsapp-float" target="_blank" title="Chat on WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 NOVA STORE. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
